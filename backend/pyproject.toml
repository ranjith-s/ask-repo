[project]
name = "ask-repo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "SIM905"]  # SIM905: a split() word list reads better than a 50-item literal

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
