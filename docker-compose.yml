services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: askrepo
      POSTGRES_PASSWORD: askrepo
      POSTGRES_DB: askrepo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askrepo"]
      interval: 2s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://askrepo:askrepo@db:5432/askrepo
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
