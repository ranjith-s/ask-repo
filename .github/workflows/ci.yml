name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: askrepo
          POSTGRES_PASSWORD: askrepo
          POSTGRES_DB: askrepo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U askrepo" --health-interval 2s --health-retries 20
      # Plain Postgres without pgvector, to test the "extension missing" error path.
      plain-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: askrepo
          POSTGRES_PASSWORD: askrepo
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U askrepo" --health-interval 2s --health-retries 20
    env:
      PLAIN_POSTGRES_URL: postgresql://askrepo:askrepo@localhost:5433/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app evals
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ask-repo .
